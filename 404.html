<title>404</title>
<meta http-equiv="refresh" content="4;url=/">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Source+Serif+4&display=swap');
  :root { --bg:#EDEFF0; --text:#1B1E22; --muted:#5B6169; --accent:#A6650B; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0B0D10; --text:#E9E7DD; --muted:#8B9198; --accent:#FFB454; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); font-family: 'Source Serif 4', Georgia, serif;
    text-align: center; padding: 1.5rem;
  }
  code { font-family: 'JetBrains Mono', monospace; }
  h1 { font-family: 'JetBrains Mono', monospace; font-size: 2.5rem; margin: 0 0 0.5rem; color: var(--accent); }
  p { color: var(--muted); margin: 0.25rem 0; }
  a { color: var(--accent); }
</style>
<div>
  <h1>404</h1>
  <p><code>$ cat: requested path: No such file or directory</code></p>
  <p>Redirecting to <a href="/">home</a>…</p>
</div>
